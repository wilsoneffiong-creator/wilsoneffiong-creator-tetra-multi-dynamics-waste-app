{% extends "base.html" %}
{% block content %}
<h2>Welcome, {{ user.email }}</h2>

<h3>Total Bookings</h3>
<p style="font-size: 2rem; font-weight: bold;">{{ stats.total }}</p>

<h3>Medical</h3>
<p style="font-size: 1.5rem;">{{ stats.medical }}</p>

<h3>Household</h3>
<p style="font-size: 1.5rem;">{{ stats.household }}</p>

<h3>E-Waste</h3>
<p style="font-size: 1.5rem;">{{ stats.e_waste }}</p>

<h3>Others</h3>
<p style="font-size: 1.5rem;">{{ stats.others }}</p>

<hr style="margin: 20px 0;">

<a href="{{ url_for('book') }}"><button style="background: #222; color: #fff; padding: 12px; border-radius: 5px; border: none; cursor: pointer; width: 100%;">New Booking</button></a>

<p style="margin-top: 15px;"><a href="{{ url_for('admin') }}">View Full Admin Table</a></p>
{% endblock %}
