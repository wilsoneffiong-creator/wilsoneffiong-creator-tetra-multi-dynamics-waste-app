{% extends "base.html" %}
{% block content %}
<h2>Welcome, {{ user.email }}</h2>

<h3>Total Bookings</h3>
<p style="font-size: 2rem; font-weight: bold;">{{ stats.total }}</p>

<h3>Medical</h3>
<p style="font-size: 1.5rem;">{{ stats.medical }}</p>

<h3>Household</h3>
<p style="font-size: 1.5rem;">{{ stats.household }}</p>

<h3>E-Waste</h3>
<p style="font-size: 1.5rem;">{{ stats.e_waste }}</p>

<h3>Others</h3>
<p style="font-size: 1.5rem;">{{ stats.others }}</p>

<hr style="margin: 20px 0;">

<!-- V5.2: Big visible button -->
<a href="/book" style="text-decoration:none;">
  <button style="background: #16a34a; color: #fff; padding: 14px; border-radius: 8px; border: none; cursor: pointer; width: 100%; font-size:1.1rem;">
    + New Booking
  </button>
</a>

<p style="margin-top: 15px;"><a href="/admin">View Admin Table</a></p>
{% endblock %}
