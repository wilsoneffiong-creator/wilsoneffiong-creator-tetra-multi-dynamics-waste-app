<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TETRA MULTI -DYNAMIC COM</title>
  <style>
    html, body { 
      height: 100%;
      min-height: 100vh;
    }
    body { 
      font-family: Arial, sans-serif; 
      margin: 0; 
      padding: 0; 
      text-align: center; 
      background-image: url("{{ url_for('static', filename='bg-waste.jpg') }}"); /* V5.8: Your image */
      background-size: contain; /* V5.8: 'contain' so full circle shows. Use 'cover' to fill screen */
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      background-color: #f4f4f4; /* V5.8: Fallback color if image fails */
    }
    
    header { 
      padding: 30px 10px 20px; 
      background: rgba(255, 255, 255, 0.95);
      border-bottom: 3px solid #222; 
      backdrop-filter: blur(4px);
    }
    header h1 { margin: 0; font-size: 2.2rem; letter-spacing: 3px; color: #222; text-align: center; }
    header h2 { margin: 8px 0 0; font-size: 1.2rem; font-weight: 500; color: #16a34a; text-align: center; }
    
    nav { 
      background: rgba(34, 34, 34, 0.95); 
      padding: 14px 20px; 
      display: flex; 
      gap: 30px; 
      justify-content: center; 
      align-items: center; 
    }
    nav a { color: #fff; text-decoration: none; font-weight: bold; font-size: 1rem; }
    nav a:hover { color: #16a34a; }
    
    .container { 
      max-width: 900px; 
      margin: 20px auto; 
      padding: 20px; 
      background: rgba(255, 255, 255, 0.96);
      border-radius: 12px; 
      text-align: left; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      min-height: 60vh;
    }
    input, select, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background: #16a34a; color: #fff; border: none; cursor: pointer; font-size: 1rem; font-weight: bold; }
    button:hover { background: #15803d; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9rem; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #222; color: #fff; }
    .flash { padding: 10px; margin: 10px 0; border-radius: 5px; text-align: center; }
    .flash.success { background: #d1fae5; color: #065f46; }
    .flash.danger { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <header>
    <h1>TETRA MULTI -DYNAMIC COM</h1>
    <h2>WASTE DISPOSAL SYSTEM</h2>
  </header>

  <nav>
    <a href="/">Home</a>
    <a href="/book">Book Now</a>
    <a href="/admin/login">Admin</a>
  </nav>

  <div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
