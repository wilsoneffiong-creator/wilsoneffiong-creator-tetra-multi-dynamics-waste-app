<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TE TRA Waste</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
    nav { background: #222; color: #fff; padding: 12px 20px; display: flex; gap: 20px; }
    nav a { color: #fff; text-decoration: none; font-weight: bold; }
    .container { max-width: 900px; margin: 20px auto; padding: 20px; background: #fff; border-radius: 8px; }
    input, select, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; border: 1px solid #ccc; }
    button { background: #16a34a; color: #fff; border: none; cursor: pointer; font-size: 1rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #222; color: #fff; }
    .flash { padding: 10px; margin: 10px 0; border-radius: 5px; }
    .flash.success { background: #d1fae5; color: #065f46; }
    .flash.danger { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <nav>
    <a href="/">TE TRA</a>
    <a href="/book">Book Now</a>
    <a href="/admin/login">Admin</a>
  </nav>
  <div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
