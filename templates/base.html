<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TETRA Waste Disposal{% endblock %}</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-image: url("{{ url_for('static', filename='bg-waste.jpg') }}");
            background-size: 60%; /* V5.8.4: 60% = Smaller circle, no crop */
            background-position: center;
            background-repeat: no-repeat; /* V5.8.4: No tiling */
            background-color: #f5f5f5; /* V5.8.4: Grey space around image */
            background-attachment: fixed;
            min-height: 100vh;
        }
        .navbar {
            background-color: #0d1b2a;
            padding: 12px 20px;
            display: flex;
            justify-content: center;
            gap: 25px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .navbar a {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }
        .navbar a:hover {
            color: #1e90ff;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .container h1 {
            margin-top: 0;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #1e90ff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #0c78e0;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('book') }}">Book Now</a>
        <a href="{{ url_for('admin') }}">Admin</a>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
