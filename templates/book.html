{% extends "base.html" %}
{% block content %}
<h2>Book Waste Pickup</h2>
<form method="POST">
  <label>Full Name</label>
  <input type="text" name="name" placeholder="John Doe" required>

  <label>Phone Number</label>
  <input type="tel" name="phone" placeholder="0803..." required>

  <label>Category</label>
  <select name="category" required>
    <option value="">Select Category</option>
    <option>Medical</option>
    <option>Household</option>
    <option>E-Waste</option>
    <option>Others</option>
  </select>

  <label>Pickup Address</label>
  <input type="text" name="address" placeholder="House 12, Wuse 2, Abuja" required>
  
  <!-- V5.4 NEW: Date + Time -->
  <label>Preferred Date</label>
  <input type="date" name="pickup_date" required min="{{ today }}">
  
  <label>Preferred Time</label>
  <select name="pickup_time" required>
    <option value="">Select Time Slot</option>
    <option>8:00 AM - 12:00 PM</option>
    <option>12:00 PM - 4:00 PM</option>
    <option>4:00 PM - 6:00 PM</option>
  </select>

  <button type="submit">Submit Booking</button>
</form>
{% endblock %}
